<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSound - Embarque</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/embarque.css">
    <link rel="stylesheet" href="../css/modales.css">
    <script src="../js/embarque.js" defer></script>
</head>

<body>

<div class="app-container">
<div class="vista activa" id="vista-embarque">
    <div class="bienvenida">
    <p>Bienvenid@, xd</p>
    <p>Área: Embarque</p>
</div>
<div class="embarque-contenido">
    <div class="embarque-lateral">
        <div class="card embarque-form">
            <h3>Crear embarque</h3>
            <div class="form-group">
                <label>ID Caja</label>
                <select>
                    <option>Seleccione caja</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha Salida</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Destino</label>
                <input type="text">
            </div>
            <div class="embarque-acciones">
                    <button class="btn btn-morado">Finalizar</button>
            </div>
        </div>
        </div>

        <div class="card embarque-centro">
            
            <div class="embarque-header">
                <h3>Entregas en curso</h3>
                    <input type="text" placeholder="Buscar mediante ID" class="form-group">
                </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Fecha salida</th>
                                <th>Fecha promesa</th>
                                <th>Estatus</th>
                            </tr>
                        </thead>
                    </table>
                
        </div>

        <div class="barco-container">
            <div class="icono-barco">
                <img src="../assets/img/barco.png" alt="barco">
            </div>
        </div>
</div>
</div>
</div>

<!-- Ventana emergente - Embarque Liberado -->
<div class="modal" id="modal-embarque-liberado">
    <div class="modal-contenedor" style="max-width: 450px; text-align: center;">
        <div class="modal-header">
            <h2>Embarque liberado</h2>
            <button class="modal-close" id="cerrar-embarque-liberado">&times;</button>
        </div>
        <div class="modal-body" style="padding: 40px 20px;">
            <p style="font-size: 1.1rem; color: #333; margin-bottom: 20px;">
                El embarque entrará en tránsito, consulte su estado más adelante.
            </p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-verde" id="btn-volver-embarque-liberado">Volver</button>
        </div>
    </div>

</div>
</body>
</html>
