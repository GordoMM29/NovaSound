<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSound - Sistemas</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/sistemas.css">
</head>

<body>
<div class="app-container">
    <div class="vista activa" id="vista-sistemas">
    <div class="bienvenida">
            <p>Bienvenid@, nombrexd</p>
            <p>Área: Sistemas</p>
        </div>

        <div class="sistemas-contenido">
            <div class="card sistemas-tabla">
            <div class="sistemas-header">
                <input type="text" placeholder="Buscar mediante ID">
            </div>
            
                <table>
                    <thead>
                        <tr>
                            <th>ID Usuario</th>
                            <th>Rol</th>
                            <th>Turno</th>
                            <th>Área</th>
                        </tr>
                    </thead>
                </table>
            </div>

            <div class="sistemas-lateral">


                <button class="btn btn-actualizar">Actualizar usuario</button>
                <button class="btn btn-eliminar">Eliminar usuario</button>
                <button class="btn btn-agg">Agregar usuario</button>
                <button class="btn btn-agg">Descargar información</button>
            </div>
        </div>
</div>
</div>

</body>
</html>
