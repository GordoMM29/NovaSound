<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSound - Ensamble</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/ensamble.css">
</head>

<body>
    <div class="app-container">
        <div class="vista activa" id="vista-ensamble">
            <div class="bienvenida">
                <p>Bienvenid@, xd</p>
                <p>Área: xd</p>
            </div>

            <div class="ensamble-contenido">
            <div class="ensamble-lateral">
            <div class="card ensamble-form">
                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Fecha Compromiso</label>
                    <input type="date">
                </div>

            </div>

            <div class="ensamble-botones">
                <button class="btn btn-verde">Enviar a pruebas</button>
                <button class="btn btn-purpura">Registrar unidades</button>
                <button class="btn btn-rojo">Reportar incidente</button>
            </div>
            </div>
            <div class="tabla-seccion">
            <h3>Registro de ensambles</h3>
            
            <div class="tabla-container">

                <table>
                    <thead>
                        <tr>
                            <th>Modelo</th>
                            <th>Orden</th>
                            <th>Usuario</th>
                            <th>Fecha</th>
                            <th>Observaciones</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>


                </table>
            </div>    
            </div>
        </div>
        </div>
    </div>

        
    </body>
</html>
