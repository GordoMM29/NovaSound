<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSound - Producción</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/produccion.css">
    <link rel="stylesheet" href="../css/modales.css">
    <script src="../js/produccion.js"></script>
</head>

<body>
<div class="app-container">
    <div class="vista activa" id="vista-produccion">
        <div class="bienvenida">
            <p>Bienvenid@, nombrexd</p>
            <p>Área: Producción</p>
        </div>

        <div class="produccion-contenido">
            <div class="card produccion-form">
                <div class="form-group">
                    <label>Cliente</label>
                    <input type="text">
                </div>
                
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="text">
                </div>
                
                <div class="form-group">
                    <label>Color</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <label>Fecha compromiso</label>
                    <input type="date">
                </div>
            </div>

            <div class="produccion-centro">
                <div class="card produccion-info">
                    <div class="form-group">
                    <label >No. Orden</label>
                    <input type="text">
                    </div>

                    <div class="form-group">
                    <label >Línea</label>
                    <input type="text">
                    </div>

                    <div class="form-group">
                    <label >Turno</label>
                    <input type="text">
                    </div>
                </div>
                <div class="produccion-botones">
                    <button class="btn btn-amarillo">Reportar Producción</button>
                    <button class="btn btn-rojo">Reportar Incidente</button>
                    </div>
            </div>

                <div class="produccion-panel">
                    <img src="../assets/img/senor.png" alt="Produccion" class="img-produccion">

                </div>
        </div>
    </div>
</div>

<!-- Ventana emergente - reportar produccion -->
<div class="modal" id="modal-reporte-produccion">
    <div class="modal-contenedor">
        <div class="modal-header">
            <h2>Reportar Produccion</h2>
            <button class="modal-close" id="cerrar-reporte-produccion">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Orden</label>
                <input type="text" value="ORD_01_031126" readonly>
            </div>
            <div class="form-group">
                <label>Cantidad Producida</label>
                <input type="number" placeholder="Ingrese cantidad">
            </div>
            <div class="form-group">
                <label>Fecha y Hora</label>
                <input type="text" id="fecha-hora-produccion" readonly>
            </div>
            <div class="aviso-amarillo">
                <strong>AVISO</strong><br>
                La cantidad no puede superar lo pendiente a lo de la orden.
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-verde" id="btn-enviar-reporte-produccion">Enviar</button>
            <button class="btn btn-gris" id="btn-cancelar-reporte-produccion">Cancelar</button>
        </div>
    </div>
</div>

<!-- Ventana emergente - reportar un incidente -->
<div class="modal" id="modal-incidente-produccion">
    <div class="modal-contenedor">
        <div class="modal-header">
            <h2>Reportar Incidente</h2>
            <button class="modal-close" id="cerrar-incidente-produccion">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Orden</label>
                <input type="text" value="ORD_01_031126" readonly>
            </div>
            <div class="form-group">
                <label>Fecha y Hora</label>
                <input type="text" id="fecha-hora-incidente" readonly>
            </div>
            <div class="form-group">
                <label>Tipo de incidente</label>
                <select>
                    <option>Apariencia</option>
                    <option>Funcional</option>
                    <option>Identificación</option>
                    <option>Empaque</option>
                    <option>Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Descripcion (MAX. 300 caracteres)</label>
                <textarea rows="4" maxlength="300" placeholder="Describa el incidente..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-rojo" id="btn-enviar-incidente-produccion">Enviar Incidente</button>
            <button class="btn btn-gris" id="btn-cancelar-incidente-produccion">Cancelar</button>
        </div>
    </div>
</div>

</body>
</html>
