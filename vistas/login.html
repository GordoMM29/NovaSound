<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSound - Login</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
<div class="app-container">
<div class="vista activa" id="vista-login">
    <div class="login-container">
        <img src="../assets/img/mini.png" alt="MINI" class="login-img">

        <div class="login-centro">
            <div class="login-logo">
                NovaSound
            </div>

            <form class="login-form">
                <div class="form-group">
                    <img src="..//assets/img/usu.png" alt="USU" class="icono-login">
                    <label>Usuario</label>
                    <input type="text">
                </div>

                <div class="form-group">
                    <img src="../assets/img/llave.png" alt="LLAVE" class="icono-login">
                    <label>Contraseña</label>
                    <input type="password">
                </div>
                <p class="registro-link">¿No tienes una cuenta? Regístrate</p>
                <button class="btn btn-morado">Inicar Sesión</button>

            </form>
        </div>
        <img src="../assets/img/mv.png" alt="MV" class="login-img">
    </div>
</div>
</div>
</body>

</html>
